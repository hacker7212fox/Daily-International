name: Daily News Push

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  push-news:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Find and run script
        env:
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          # 查找脚本位置
          SCRIPT_PATH=$(find $GITHUB_WORKSPACE -name "fetch_news.py" -type f 2>/dev/null | head -1)
          echo "Found script at: $SCRIPT_PATH"
          
          if [ -z "$SCRIPT_PATH" ]; then
            echo "Error: fetch_news.py not found"
            echo "Current directory: $(pwd)"
            echo "Files here:"
            ls -la
            exit 1
          fi
          
          # 切换到脚本所在目录并运行
          cd "$(dirname "$SCRIPT_PATH")"
          python fetch_news.py
